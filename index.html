<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Buffi</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#start{
    font-size:2em;
    text-align:center;
    cursor:pointer;
}

#videoBox{
    display:none;
    position:fixed;
    inset:0;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}
</style>
</head>
<body>

<div id="start">
😺 Tocca per avviare il meme
</div>

<div id="videoBox">
    <video id="jumpscare" playsinline>
        <source src="vlipsy-creepy-face-jump-scare-3hEsFXt9.mp4" type="video/mp4">
    </video>
</div>

<script>
const start = document.getElementById("start");
const box = document.getElementById("videoBox");
const video = document.getElementById("jumpscare");

start.addEventListener("click", async () => {

    // sblocca audio su Chrome
    video.volume = 1.0;
    await video.play().catch(()=>{});

    // vibrazione
    if (navigator.vibrate) {
        navigator.vibrate(150);
    }

    // piccolo delay effetto “caricamento”
    setTimeout(() => {
        start.style.display = "none";
        box.style.display = "block";

        video.currentTime = 0;
        video.play();

    }, 250);

});
</script>

</body>
</html>
