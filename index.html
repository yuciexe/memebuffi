<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Buffi</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#overlay{
    text-align:center;
    cursor:pointer;
}

#title{
    font-size:2em;
}

#sub{
    font-size:1em;
    opacity:0.7;
    margin-top:10px;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

#videoBox{
    display:none;
    position:fixed;
    inset:0;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}
</style>
</head>
<body>

<div id="overlay">
    <div id="title">😺 Meme divertentissimi</div>
    <div id="sub">Tocca lo schermo per continuare</div>
</div>

<div id="videoBox">
    <video id="jumpscare" playsinline>
        <source src="vlipsy-creepy-face-jump-scare-3hEsFXt9.mp4" type="video/mp4">
    </video>
</div>

<script>
const overlay = document.getElementById("overlay");
const box = document.getElementById("videoBox");
const video = document.getElementById("jumpscare");

overlay.addEventListener("click", async () => {

    // nascondi subito UI
    overlay.style.display = "none";

    // mostra video
    box.style.display = "block";

    // vibrazione
    if (navigator.vibrate) {
        navigator.vibrate(200);
    }

    // audio massimo
    video.volume = 1.0;

    await video.play().catch(()=>{});

    // effetto delay jumpscare
    setTimeout(() => {
        video.currentTime = 0;
        video.play();
    }, 1000);

    <a href="www.memebuffi.com">www.memebuffi.com</a>

});
</script>

</body>
</html>
